name: Release & Publish

# Runs when a version tag (v1.2.3) is pushed or manually dispatched:
# builds the extension, publishes it to the VS Code Marketplace
# (needs the VSCE_PAT repository secret) and creates a GitHub Release
# with the packaged .vsix.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  VSCE_PAT: ${{ secrets.VSCE_PAT }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Unit smoke tests (sidebar + catalog)
        run: node test/view-tests.js

      - name: Package .vsix
        run: npx @vscode/vsce package --no-dependencies

      - name: Publish to VS Code Marketplace
        # Marketplace auth problems must never block the GitHub Release below.
        continue-on-error: true
        if: env.VSCE_PAT != ''
        run: npx @vscode/vsce publish --no-dependencies

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: graphics-h-runner-*.vsix
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
